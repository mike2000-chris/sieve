# Machine-readable archive map for gate G3 (paper Section 5). Update access/latency after the Phase 0 smoke tests.
archives:
  - key: exoplanet_archive
    name: NASA Exoplanet Archive
    content: confirmed planets, candidates, stellar hosts, transmission spectra
    access: [tap, api, astroquery.ipac.nexsci.nasa_exoplanet_archive]
    scale: "6,000+ confirmed planets, 10,000+ candidates"
    licence: public
    suitability: high
    url: https://exoplanetarchive.ipac.caltech.edu/
    smoke_test:   # 2026-11-07
      status: ok
      access_path: pyvo TAP sync -> https://exoplanetarchive.ipac.caltech.edu/TAP, table pscomppars
      latency: "1.7 s for 495 planets with 200 K <= pl_eqt <= 350 K"
      licence: public (NASA Exoplanet Archive; acknowledgement requested)
  - key: mast
    name: MAST (Kepler/K2, TESS, HST, JWST)
    content: light curves, full-frame images, spectra
    access: [astroquery.mast, lightkurve, s3]
    scale: "TESS 80M+ FFI light curves via T16-type products"
    licence: public after proprietary period
    suitability: high
    url: https://archive.stsci.edu/
    smoke_test:   # 2026-11-07
      status: ok (via S3 mirror)
      access_path: boto3 unsigned S3, bucket stpubdata, tess/public/tid/sNNNN/<TIC in 4-digit groups>/; read with lightkurve.read
      latency: "list + 2 MB SPOC light curve (pi Men, sector 1, 18,279 cadences) 1.5 s"
      licence: public (MAST, NASA)
      caveat: "MAST portal search (lightkurve.search_lightcurve / astroquery Observations.query_criteria) failed on 2026-11-07: RemoteServiceError, then a 34-min hang ending in connection reset, despite astroquery timeout=120. Name lookup API answered. Use S3 first, portal as fallback."
  - key: gaia
    name: ESA Gaia (DR3 now, DR4 on 2026-12-02)
    content: astrometry, photometry, low-res spectra, variability; DR4 adds full epoch time series (5.5 yr)
    access: [adql, astroquery.gaia]
    scale: "~1.8 billion sources"
    licence: public
    suitability: very_high
    notes: run archive-side ADQL; DR4 day-one queries prepared in analyses/dr4-day-one/
    # Row limit for async jobs when logged in (GAIA_USER / GAIA_PASSWORD in .env). null = unknown: it must be
    # measured on the first login (a query whose COUNT is known to exceed 50,000) before it is set here.
    # While null, authenticated runs keep the anonymous 50,000-row cap and 40,000-row chunks.
    authenticated_row_limit: null
    url: https://gea.esac.esa.int/archive/
    smoke_test:   # 2026-11-07, pipeline/archives/smoke.py, results in analyses/smoke-tests-phase0/results/smoke.json
      status: ok
      access_path: astroquery.gaia launch_job_async -> https://gea.esac.esa.int/tap-server (anonymous)
      latency: "COUNT(*) 2.5 s; 60,235-row sample in 4 RA chunks 21 s"
      licence: "ESA Gaia data, CC BY-SA 3.0 IGO (acknowledge ESA/Gaia/DPAC)"
      caveat: "anonymous async results are cut at 50,000 rows WITHOUT error (Gaia.ROW_LIMIT=-1 does not help); chunk queries and check against COUNT(*). Archive release 3.15 announced breaking changes."
  - key: irsa_ir
    name: IRSA (AllWISE, NEOWISE, 2MASS, Spitzer)
    content: infrared photometry, multi-epoch WISE
    access: [tap, astroquery.ipac.irsa]
    scale: "~750M AllWISE sources"
    licence: public
    suitability: very_high
    url: https://irsa.ipac.caltech.edu/
    smoke_test:   # 2026-11-07
      status: ok
      access_path: pyvo TAP async with TAP_UPLOAD -> https://irsa.ipac.caltech.edu/TAP, table allwise_p3as_psd
      latency: "positional cross-match of 60,235 uploaded Gaia positions (3 arcsec) 18 min; Gaia-side gaiadr3.allwise_best_neighbour 3 s"
      result: "59,603 matched (17 with >1 match), median separation 0.06 arcsec, p95 0.65 arcsec after propagating Gaia positions J2016.0 -> J2010.5; allwise_best_neighbour gives 53,525"
      licence: public (IPAC/IRSA, NASA)
      caveat: "IRSA rejects JOIN ... ON CONTAINS(...) with uploads (use comma join + WHERE). IRSA DISTANCE() returns arcsec, not degrees as in the ADQL standard (verified with a 1-arcsec offset). For large samples prefer Gaia's precomputed cross-match tables."
  - key: spherex
    name: IRSA SPHEREx Quick Release (QR2/QR3)
    content: all-sky 0.75-5 um spectral images, 102 bands, weekly releases
    access: [s3://nasa-irsa-spherex/ (no account), irsa_sia2]
    scale: full sky twice a year
    licence: public
    suitability: high
    notes: new spectral archive; under-explored for signatures
    url: https://irsa.ipac.caltech.edu/data/SPHEREx/
    smoke_test:   # 2026-11-07
      status: ok
      access_path: boto3 unsigned S3, bucket nasa-irsa-spherex (us-east-1); prefixes qr2/, qr3/
      latency: "list 0.4 s; 2,880-byte range read of a 16.7 MB FITS header 0.2 s"
      licence: public (IPAC/IRSA, NASA)
      caveat: aws CLI not needed; boto3 with signature_version=UNSIGNED works
  - key: breakthrough_listen
    name: Breakthrough Listen Open Data Archive
    content: radio spectrograms (GBT, Parkes), target lists, published candidate lists
    access: [http, cloud]
    scale: petabyte-scale; subsets manageable
    licence: public
    suitability: medium
    notes: use published candidate lists and targeted subsets
    url: https://seti.berkeley.edu/opendata
  - key: pds
    name: Planetary Data System
    content: Cassini, Galileo, Juno, MRO, Mars rovers, Voyager, Pioneer Venus
    access: [pds_nodes, http]
    scale: mission-specific
    licence: public
    suitability: medium
    url: https://pds.nasa.gov/
  - key: ztf
    name: ZTF public data releases and alert brokers
    content: optical time series, alerts since 2018
    access: [irsa, brokers: [fink, alerce, antares, lasair]]
    scale: billions of detections
    licence: public
    suitability: high
    url: https://www.ztf.caltech.edu/
  - key: rubin
    name: Rubin Observatory (alerts public; DP2; DR1 ~2028 with data rights)
    content: alert stream, Data Preview 2, DR1
    access: [brokers, rubin_science_platform]
    scale: up to 7M alerts/night
    licence: alerts public; images and DR catalogues need data rights
    suitability: high_for_alerts
    url: https://rubinobservatory.org/
  - key: optical_spectra
    name: SDSS, LAMOST, Gaia RVS
    content: optical stellar and galaxy spectra
    access: [casjobs, tap]
    scale: millions of spectra
    licence: public
    suitability: medium
  - key: euclid
    name: ESA Euclid (Q1, Q2, DR1-Foundation Nov 2026)
    content: deep optical/NIR imaging and spectra over ~1,900 deg2 in DR1-Foundation
    access: [esa_euclid_archive, irsa_mirror]
    scale: DR1-Foundation Nov 2026
    licence: public
    suitability: low_to_medium
    url: https://www.cosmos.esa.int/web/euclid
literature:
  - key: ads
    name: NASA ADS
    access: https://api.adsabs.harvard.edu/v1/
    auth: ADS_API_KEY
  - key: openalex
    name: OpenAlex
    access: https://api.openalex.org/
    auth: none (mailto recommended)
  - key: arxiv
    name: arXiv API
    access: https://export.arxiv.org/api/query
    auth: none
