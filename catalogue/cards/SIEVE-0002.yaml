id: SIEVE-0002
version: 2
title: Smooth 300-600 K blackbody excess at 3-5 um around Gaia 100-pc FGKM dwarfs in SPHEREx QR spectral images
claim: Fewer than 1 in 10^4 Gaia DR3 main-sequence stars within 100 pc show a 3.5-5.0 um flux excess above 5 per
  cent whose spectral slope fits a single 300-600 K blackbody to chi2_nu<1.5 with no feature deeper than 2 per cent.
domain: technosignature
signature_class: thermal_waste_heat
observable: spectral_excess
timescale: snapshot
mechanism: A partial Dyson swarm absorbs a fraction f of starlight and re-radiates it at its operating temperature.
  For a G2V star and a 400 K radiator, the excess at 4.5 um is about 11f of the photosphere and at 3.5 um about
  1.5f. So f=1 per cent gives an 11 per cent excess at 4.5 um and a sevenfold rise in excess from 3.5 to 4.5 um.
  This assumes the radiators are near-blackbody and optically thick, and that the luminosity escapes only as thermal
  emission. WISE W1/W2 gives two points; the 102 SPHEREx channels give the Wien-side curvature.
data_requirements:
  measured_quantity: flux excess per SPHEREx channel at 3.0-5.0 um over a photospheric model fitted to Gaia XP +
    2MASS, in per cent, plus best-fit blackbody temperature of the residual
  wavelength_um:
  - 0.75
  - 5
  spectral_resolution: R~35-130 (SPHEREx LVF channels)
  cadence: single all-sky pass (snapshot); second pass used only for artifact rejection
  depth: stars with Ks<12 to keep per-channel S/N>20 at 4.5 um
  sample: ~3x10^5 Gaia DR3 main-sequence stars within 100 pc
candidate_archives:
- name: IRSA SPHEREx Quick Release
  access: boto3 unsigned S3, bucket nasa-irsa-spherex (us-east-1), prefixes qr2/ and qr3/, spectral image cubes
    with WCS
- name: Gaia DR3
  access: 'ESA Gaia TAP: gaiadr3.gaia_source, gaiadr3.astrophysical_parameters, gaiadr3.xp_continuous_mean_spectrum'
- name: 2MASS Point Source Catalog
  access: IRSA TAP table fp_psc
- name: AllWISE / CatWISE2020
  access: IRSA TAP tables allwise_p3as_psd and catwise_2020
method: Select Gaia DR3 sources with parallax>10 mas, RUWE<1.4 and a main-sequence position in the CMD. Fit a photospheric
  model to Gaia XP spectra plus 2MASS JHKs (PHOENIX/BT-Settl grid, Teff/logg/[Fe/H] from Gaia GSP-Phot). Pull SPHEREx
  QR2/QR3 spectral image cutouts and do forced PSF photometry at Gaia positions propagated to the SPHEREx epoch.
  Compute the per-channel ratio of observed to model flux. Fit a single-temperature blackbody to the 3.0-5.0 um
  residual. Rank sources by excess significance and by the chi2 of a featureless fit. Release the ranked residue
  table.
confounders:
- name: Warm debris disk around a young star
  exclusion: Estimate age from Gaia kinematics, LAMOST/GALAH Li 6708 and moving-group membership. Debris also shows
    a rising 12/22 um WISE W3/W4 excess that a 400 K single-component radiator underpredicts.
- name: Blended background galaxy or red companion in the 6.2 arcsec SPHEREx pixel
  exclusion: Check Legacy Survey DR10 and Gaia for neighbours within 12 arcsec. Brown-dwarf companions show CH4
    absorption at 3.3 um and CO at 4.6 um in the SPHEREx spectrum.
- name: SPHEREx calibration or LVF edge systematics
  exclusion: Compare against constant-star control samples matched in magnitude and focal-plane position. Require
    the excess in both semiannual passes.
novelty:
  status: partly_done
  confidence: high
  rationale: The claim that partial Dyson-sphere waste heat (100-1000 K) appears as a photospheric infrared excess
    in very few stars has been tested on Gaia+2MASS+WISE photometry, yielding occurrence upper limits near 1 in
    10^5 (2022MNRAS.512.2988S) and a handful of M-dwarf candidates (2024MNRAS.531..695S). Those candidates are now
    largely attributed to background contamination (2024RNAAS...8..145R, 2026arXiv260703619R). A data-driven W1/W2
    excess search over five million FGK stars (2024AJ....168..157C) covers the same 3-5 um band but only with two
    broadband points. None of the listed works uses SPHEREx channel-resolved 3-5 um spectra to test whether the
    residual is a smooth, featureless single-temperature 300-600 K blackbody, so the card is a new-archive, sharper-observable
    version of an already tested claim.
  closest_prior:
  - bibcode: 2024MNRAS.531..695S
    register_id: REG-hephaistos-ii-2024
    relation: Fit photosphere-plus-blackbody SEDs to Gaia DR3/2MASS/AllWISE photometry for ~5 million stars and
      found 7 M-dwarf excess candidates; it used broadband WISE points rather than SPHEREx spectra and placed no
      limit on spectral smoothness.
  - bibcode: 2022MNRAS.512.2988S
    register_id: REG-hephaistos-i-2022
    relation: Set upper limits of order 1 in 10^5 on the fraction of stars hosting 100-1000 K partial Dyson spheres,
      using Gaia DR2+AllWISE colour cuts; same occurrence-rate claim, but with colours and no spectral-shape test.
  - bibcode: 2024AJ....168..157C
    relation: Searched 4.9 million main-sequence FGK stars for W1/W2 (3.4/4.6 um) excess with machine-learning photospheric
      predictions and found 53 objects; same wavelength range, but only two broadband points and no blackbody-temperature
      or feature-depth test.
  - bibcode: 2009ApJ...698.2075C
    register_id: REG-carrigan-iras-dyson-2009
    relation: Fit 100-600 K blackbodies to IRAS LRS spectra of ~250,000 sources and set Dyson-sphere upper limits;
      spectral-shape test of the same claim, but at longer wavelengths and much shallower depth.
  what_would_make_it_open: No listed work uses SPHEREx 3.0-5.0 um channel-resolved residuals over a Gaia XP+2MASS
    photosphere to bound the fraction of 100-pc dwarfs with a >5 per cent excess that is a featureless single 300-600
    K blackbody, so delivering that per-channel spectral-shape constraint and ranked residue table is the new contribution.
  queries_run:
  - Dyson sphere candidates Gaia WISE
  - Dyson sphere infrared excess search
  - warm infrared excess main-sequence stars
  - SPHEREx stellar infrared excess
  - hot dust excess nearby dwarfs WISE
