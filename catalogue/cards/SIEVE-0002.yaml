id: SIEVE-0002
version: 5
title: Smooth 300-600 K blackbody excess at 3-5 um around Gaia 100-pc FGKM dwarfs in SPHEREx QR spectral images
claim: Fewer than 1 in 10^4 Gaia DR3 main-sequence stars within 100 pc show a 3.5-5.0 um flux excess above 5 per
  cent whose spectral slope fits a single 300-600 K blackbody to chi2_nu<1.5 with no feature deeper than 2 per cent.
domain: technosignature
signature_class: thermal_waste_heat
observable: spectral_excess
timescale: snapshot
mechanism: A partial Dyson swarm absorbs a fraction f of starlight and re-radiates it at its operating temperature.
  For a G2V star and a 400 K radiator, the excess at 4.5 um is about 11f of the photosphere and at 3.5 um about
  1.5f. So f=1 per cent gives an 11 per cent excess at 4.5 um and a sevenfold rise in excess from 3.5 to 4.5 um.
  This assumes the radiators are near-blackbody and optically thick, and that the luminosity escapes only as thermal
  emission. WISE W1/W2 gives two points; the 102 SPHEREx channels give the Wien-side curvature.
data_requirements:
  measured_quantity: flux excess per SPHEREx channel at 3.0-5.0 um over a photospheric model fitted to Gaia XP +
    2MASS, in per cent, plus best-fit blackbody temperature of the residual
  wavelength_um:
  - 0.75
  - 5
  spectral_resolution: R~35-130 (SPHEREx LVF channels)
  cadence: single all-sky pass (snapshot); second pass used only for artifact rejection
  depth: stars with Ks<12 to keep per-channel S/N>20 at 4.5 um
  sample: ~3x10^5 Gaia DR3 main-sequence stars within 100 pc
candidate_archives:
- name: IRSA SPHEREx Quick Release
  access: boto3 unsigned S3, bucket nasa-irsa-spherex (us-east-1), prefixes qr2/ and qr3/, spectral image cubes
    with WCS
  licence: public (IPAC/IRSA, NASA)
  volume_estimate: 'FITS images ~16.7 MB each. Header index: 2,880 bytes per image. Pixel stamps via row-range reads:
    order 1-10 TB for ~3x10^5 stars x ~100-200 exposures x image/variance/flag rows; order-of-magnitude, exposure
    counts to verify. Whole-image download would be far larger.'
- name: Gaia DR3
  access: 'ESA Gaia TAP: gaiadr3.gaia_source, gaiadr3.astrophysical_parameters, gaiadr3.xp_continuous_mean_spectrum'
  licence: CC BY-SA 3.0 IGO (acknowledge ESA/Gaia/DPAC)
  volume_estimate: ~3x10^5 rows of astrometry/parameters (~100 MB). XP coefficients with covariances order 1-3 GB,
    retrieved in <=50,000-row chunks.
- name: 2MASS Point Source Catalog
  access: IRSA TAP table fp_psc
  licence: public (IPAC/IRSA, NASA)
  volume_estimate: ~3x10^5 rows, ~50 MB
- name: AllWISE / CatWISE2020
  access: IRSA TAP tables allwise_p3as_psd and catwise_2020
  licence: public (IPAC/IRSA, NASA)
  volume_estimate: ~3x10^5 rows, ~50 MB
method: Select Gaia DR3 sources with parallax>10 mas, RUWE<1.4 and a main-sequence position in the CMD. Fit a photospheric
  model to Gaia XP spectra plus 2MASS JHKs (PHOENIX/BT-Settl grid, Teff/logg/[Fe/H] from Gaia GSP-Phot). Pull SPHEREx
  QR2/QR3 spectral image cutouts and do forced PSF photometry at Gaia positions propagated to the SPHEREx epoch.
  Compute the per-channel ratio of observed to model flux. Fit a single-temperature blackbody to the 3.0-5.0 um
  residual. Rank sources by excess significance and by the chi2 of a featureless fit. Release the ranked residue
  table.
confounders:
- name: Warm debris disk around a young star
  exclusion: Estimate age from Gaia kinematics, LAMOST/GALAH Li 6708 and moving-group membership. Debris also shows
    a rising 12/22 um WISE W3/W4 excess that a 400 K single-component radiator underpredicts.
- name: Blended background galaxy or red companion in the 6.2 arcsec SPHEREx pixel
  exclusion: Check Legacy Survey DR10 and Gaia for neighbours within 12 arcsec. Brown-dwarf companions show CH4
    absorption at 3.3 um and CO at 4.6 um in the SPHEREx spectrum.
- name: SPHEREx calibration or LVF edge systematics
  exclusion: Compare against constant-star control samples matched in magnitude and focal-plane position. Require
    the excess in both semiannual passes.
- name: Warm debris disc or hot exozodiacal dust of large grains
  exclusion: 'The card''s test (age from kinematics, Li 6708, moving groups, plus W3/W4 shape) is necessary but
    not enough. Fit the 3-5 um residual jointly with W3 (12 um) and W4 (22 um). A single 400 K blackbody fixes the
    W3/W4 ratio; any colder component adds W4 flux and points to dust. Where archival Spitzer IRS spectra exist,
    look for a 10 um silicate feature. A fully large-grain, single-temperature belt with no colder material is spectrally
    identical to a radiator, so age cuts only lower its prior. Data: AllWISE/CatWISE2020 W1-W4 with cc_flags=''0000''
    and ext_flg=0; Spitzer IRAC/MIPS/IRS and Herschel PACS archives; AKARI IRC/FIS; NEOWISE multi-epoch W1/W2 for
    variable collisional dust; LAMOST/GALAH Li; BANYAN-type moving-group membership; eROSITA/ROSAT X-ray activity
    as an age proxy [G4 excludable: partly]'
- name: Unresolved cool companion (late M, L, T or Y dwarf)
  exclusion: 'The card''s CH4 3.3 um / CO 4.6 um test works for T/Y dwarfs but is weak for L dwarfs. Add the following:
    Gaia DR3 RUWE (the card''s <1.4 cut lets through face-on and long-period systems), ipd_frac_multi_peak, ipd_gof_harmonic_amplitude,
    non_single_star and duplicated_source flags; Gaia DR3 proper-motion anomaly against Hipparcos where available;
    and a fit of the residual with BT-Settl/Sonora L-T templates compared with a blackbody by Delta-chi2. Set the
    template-preference threshold on a control sample of known L/T companions. Systems at small separation with
    no astrometric signal remain. Data: Gaia DR3 gaia_source flags and NSS tables; Hipparcos-Gaia proper-motion
    anomaly catalogue; 2MASS/UKIDSS/VHS JHK; CatWISE2020 colours and motions; archival AO imaging lists for nearby
    stars [G4 excludable: partly]'
- name: M-dwarf photospheric model mismatch at 3-5 um
  exclusion: 'Not covered by the card. Replace the pure model photosphere with empirical loci. Calibrate the excess
    on SPHEREx spectra of a control sample matched in Teff, [Fe/H] and absolute magnitude, and require the source
    to be an outlier against that locus. Cross-check Teff with independent spectroscopic values. Also test the W1-W2
    versus G-Ks or BP-RP relation for the same Teff bin. The outlier threshold must be calibrated on the control
    sample. Data: SPHEREx QR spectra of matched controls; LAMOST, APOGEE and GALAH stellar parameters; Gaia DR3
    astrophysical_parameters; AllWISE W1/W2 [G4 excludable: yes]'
- name: Blended background galaxy, AGN or neighbouring star
  exclusion: 'The card''s 12 arcsec neighbour check in Legacy Survey DR10 and Gaia is adequate for resolved sources
    but should be extended in two ways. First, test co-motion: 100-pc stars move by more than about 0.1 arcsec/yr,
    so compare the CatWISE2020/unWISE W2 centroid and its motion with the Gaia position propagated to each epoch.
    A fixed W2 centroid offset means a background source. Second, check PAH 3.3 um emission in the SPHEREx residual,
    which indicates a star-forming galaxy. Use a local-background annulus to reject cirrus. Data: Legacy Survey
    DR10; Gaia DR3; CatWISE2020 and unWISE motions; Pan-STARRS1; VHS/UKIDSS; Planck/IRAS dust maps for cirrus [G4
    excludable: yes]'
- name: SPHEREx calibration, LVF edge and bright-star systematics
  exclusion: 'The card''s matched-control and two-pass requirement is adequate if extended. Match controls in focal-plane
    position, LVF position, magnitude and colour. Require consistency across independent exposures and across both
    semiannual passes. Reject pixels using the SPHEREx flag rows. Add an injection-recovery test of synthetic blackbody
    excesses. Set the bright-star non-linearity threshold on a control sample rather than assuming one. Data: SPHEREx
    QR2/QR3 image, variance and flag planes; multi-exposure coverage; control stars of constant flux [G4 excludable:
    yes]'
- name: Look-elsewhere and Eddington selection in a 3x10^5-star ranking
  exclusion: 'Not covered by the card. Measure the distribution of negative ''excesses'', which should be a mirror
    of the positive tail if the excesses are noise. Estimate the false-positive rate from blackbody fits to the
    negated residuals of controls. Include per-channel covariance in the chi2. Require the excess to be reproduced
    in W1/W2 and in the second pass. Data: Full SPHEREx residue table; AllWISE/CatWISE W1/W2 photometry [G4 excludable:
    yes]'
- name: Misclassified young stellar object or evolved dusty star
  exclusion: 'Check the CMD position with Gaia parallax_over_error above a threshold to calibrate on a control sample.
    Look for Brackett-alpha 4.05 um emission in the SPHEREx spectrum and for H-alpha emission or Li. Check X-ray/UV
    activity. Check SIMBAD types. Within 100 pc these sources are few and well catalogued. Data: Gaia DR3; SIMBAD;
    eROSITA DR1/ROSAT; GALEX; LAMOST/GALAH; IPHAS/VPHAS H-alpha where available [G4 excludable: yes]'
- name: Epoch mismatch and stellar variability
  exclusion: 'Normalise the photosphere on the contemporaneous SPHEREx 0.75-2.5 um channels rather than on 2MASS
    alone. Propagate positions with full Gaia astrometry. Use the second pass and NEOWISE light curves to flag variables.
    Data: SPHEREx short-wavelength channels; NEOWISE W1/W2 time series; TESS light curves; Gaia DR3 variability
    tables [G4 excludable: yes]'
novelty:
  status: partly_done
  confidence: high
  rationale: The claim that partial Dyson-sphere waste heat (100-1000 K) appears as a photospheric infrared excess
    in very few stars has been tested on Gaia+2MASS+WISE photometry, yielding occurrence upper limits near 1 in
    10^5 (2022MNRAS.512.2988S) and a handful of M-dwarf candidates (2024MNRAS.531..695S). Those candidates are now
    largely attributed to background contamination (2024RNAAS...8..145R, 2026arXiv260703619R). A data-driven W1/W2
    excess search over five million FGK stars (2024AJ....168..157C) covers the same 3-5 um band but only with two
    broadband points. None of the listed works uses SPHEREx channel-resolved 3-5 um spectra to test whether the
    residual is a smooth, featureless single-temperature 300-600 K blackbody, so the card is a new-archive, sharper-observable
    version of an already tested claim.
  closest_prior:
  - bibcode: 2024MNRAS.531..695S
    register_id: REG-hephaistos-ii-2024
    relation: Fit photosphere-plus-blackbody SEDs to Gaia DR3/2MASS/AllWISE photometry for ~5 million stars and
      found 7 M-dwarf excess candidates; it used broadband WISE points rather than SPHEREx spectra and placed no
      limit on spectral smoothness.
  - bibcode: 2022MNRAS.512.2988S
    register_id: REG-hephaistos-i-2022
    relation: Set upper limits of order 1 in 10^5 on the fraction of stars hosting 100-1000 K partial Dyson spheres,
      using Gaia DR2+AllWISE colour cuts; same occurrence-rate claim, but with colours and no spectral-shape test.
  - bibcode: 2024AJ....168..157C
    relation: Searched 4.9 million main-sequence FGK stars for W1/W2 (3.4/4.6 um) excess with machine-learning photospheric
      predictions and found 53 objects; same wavelength range, but only two broadband points and no blackbody-temperature
      or feature-depth test.
  - bibcode: 2009ApJ...698.2075C
    register_id: REG-carrigan-iras-dyson-2009
    relation: Fit 100-600 K blackbodies to IRAS LRS spectra of ~250,000 sources and set Dyson-sphere upper limits;
      spectral-shape test of the same claim, but at longer wavelengths and much shallower depth.
  what_would_make_it_open: No listed work uses SPHEREx 3.0-5.0 um channel-resolved residuals over a Gaia XP+2MASS
    photosphere to bound the fraction of 100-pc dwarfs with a >5 per cent excess that is a featureless single 300-600
    K blackbody, so delivering that per-channel spectral-shape constraint and ranked residue table is the new contribution.
  queries_run:
  - Dyson sphere candidates Gaia WISE
  - Dyson sphere infrared excess search
  - warm infrared excess main-sequence stars
  - SPHEREx stellar infrared excess
  - hot dust excess nearby dwarfs WISE
