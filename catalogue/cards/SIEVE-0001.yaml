id: SIEVE-0001
version: 3
title: Waste-heat excess of partial Dyson swarms in SPHEREx 0.75-5 um spectra
claim: 'Stars hosting partial Dyson swarms show a smooth 2-5 um excess over the photospheric model that is spectrally
  distinct from debris-disc dust.

  '
domain: technosignature
signature_class: thermal_waste_heat
observable: spectral_excess
timescale: snapshot
mechanism: 'Absorbed starlight re-emitted at 100-600 K; covering fraction f gives excess ~ f * L_star; f >= 0.01
  detectable at S/N > 10 for G < 12 within 100 pc given SPHEREx per-channel depth (to be verified in G1).

  '
data_requirements:
  wavelength_um:
  - 0.75
  - 5.0
  spectral_resolution: R >= 35
  cadence: none
  depth: SPHEREx all-sky
  sample: Gaia DR3 stars, G < 12, d < 100 pc
candidate_archives:
- name: IRSA SPHEREx QR2/QR3
  access: S3 s3://nasa-irsa-spherex/ (no account), IRSA SIA2
  licence: public
- name: Gaia DR3
  access: ADQL via Gaia Archive
  licence: public
method: 'Forward-model photosphere + blackbody excess; outlier detection on residual shape; cross-match AllWISE
  and radio surveys for background contamination.

  '
confounders:
- name: debris discs
  exclusion: spectral shape and age indicators; prior disc catalogues
- name: background dust-obscured galaxies
  exclusion: radio cross-match within 10 arcsec (REG-ren-2024-contamination method)
- name: unresolved binaries / young stellar objects
  exclusion: Gaia RUWE, H-alpha, variability
novelty:
  status: open
  confidence: high
  rationale: The card measures the spectral shape of a smooth 2-5 um excess across the roughly 100 SPHEREx channels
    at R >= 35, and asks whether that shape separates partial-swarm-like waste heat from debris-disc dust. Project
    Hephaistos I and II (2022MNRAS.512.2988S, 2024MNRAS.531..695S), Contardo et al. (2024AJ....168..157C) and Blain
    (2024arXiv240911447B) all rest on broadband 2MASS/WISE photometry, which can show that an excess exists but
    cannot resolve its 2-5 um spectral shape. Carrigan (2009ApJ...698.2075C) did fit blackbody spectral shapes,
    but only to IRAS LRS spectra at about 8-23 um for bright sources, not the near-IR Wien side of the excess. No
    listed work measures this shape-based quantity, so the claim has not been tested.
  closest_prior:
  - bibcode: 2009ApJ...698.2075C
    register_id: REG-carrigan-iras-dyson-2009
    relation: Fit 100-600 K blackbody shapes to IRAS LRS mid-IR spectra (~8-23 um) of bright sources; it did not
      measure the 2-5 um excess shape at SPHEREx depth.
  - bibcode: 2024MNRAS.531..695S
    register_id: REG-hephaistos-ii-2024
    relation: Hephaistos II fit photosphere-plus-blackbody SEDs to Gaia/2MASS/WISE broadband photometry for ~5 million
      stars; it measured band excesses, not a resolved 2-5 um spectral shape.
  - bibcode: 2022MNRAS.512.2988S
    register_id: REG-hephaistos-i-2022
    relation: Hephaistos I set upper limits from Gaia-AllWISE colour cuts; it counted objects in colour regions
      and did not measure spectral shape.
  - bibcode: 2024AJ....168..157C
    relation: Data-driven W1/W2 excess search in about 4.9 million FGK stars aimed at extreme debris discs; it measured
      two-band excess amplitude only, not shape discrimination from dust.
  queries_run:
  - partial Dyson spheres infrared excess
  - Dyson sphere candidates Gaia WISE
  - waste heat technosignature mid-infrared
  - SPHEREx stellar infrared excess
  - warm debris disk near-infrared excess
  judged:
    model: claude-opus-5-5
    prompt_version: critique-g2-novelty-v0.3
    date: '2026-11-11'
    by: Claude Code (claude-fable-5-2)
  audited_by_human: false
