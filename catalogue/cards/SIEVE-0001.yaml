id: SIEVE-0001
version: 2
title: Waste-heat excess of partial Dyson swarms in SPHEREx 0.75-5 um spectra
claim: 'Stars hosting partial Dyson swarms show a smooth 2-5 um excess over the photospheric model that is spectrally
  distinct from debris-disc dust.

  '
domain: technosignature
signature_class: thermal_waste_heat
observable: spectral_excess
timescale: snapshot
mechanism: 'Absorbed starlight re-emitted at 100-600 K; covering fraction f gives excess ~ f * L_star; f >= 0.01
  detectable at S/N > 10 for G < 12 within 100 pc given SPHEREx per-channel depth (to be verified in G1).

  '
data_requirements:
  wavelength_um:
  - 0.75
  - 5.0
  spectral_resolution: R >= 35
  cadence: none
  depth: SPHEREx all-sky
  sample: Gaia DR3 stars, G < 12, d < 100 pc
candidate_archives:
- name: IRSA SPHEREx QR2/QR3
  access: S3 s3://nasa-irsa-spherex/ (no account), IRSA SIA2
  licence: public
- name: Gaia DR3
  access: ADQL via Gaia Archive
  licence: public
method: 'Forward-model photosphere + blackbody excess; outlier detection on residual shape; cross-match AllWISE
  and radio surveys for background contamination.

  '
confounders:
- name: debris discs
  exclusion: spectral shape and age indicators; prior disc catalogues
- name: background dust-obscured galaxies
  exclusion: radio cross-match within 10 arcsec (REG-ren-2024-contamination method)
- name: unresolved binaries / young stellar objects
  exclusion: Gaia RUWE, H-alpha, variability
novelty:
  status: partly_done
  confidence: high
  rationale: The idea that partial Dyson spheres produce a waste-heat infrared excess separable from natural dust
    has been tested several times. Hephaistos II (2024MNRAS.531..695S) and Hephaistos I (2022MNRAS.512.2988S) did
    this with Gaia, 2MASS and WISE broadband photometry, and Carrigan (2009ApJ...698.2075C) fitted 100-600 K blackbodies
    to IRAS low-resolution spectra. None of the listed works uses low-resolution 0.75-5 um spectra such as SPHEREx,
    or tests whether the excess shape across 2-5 um is spectrally distinct from debris-disc dust. The card is therefore
    the same claim in a new archive with a spectral rather than photometric observable.
  closest_prior:
  - bibcode: 2024MNRAS.531..695S
    register_id: REG-hephaistos-ii-2024
    relation: Tested partial-Dyson-sphere IR excess against a blackbody-plus-photosphere model using Gaia DR3, 2MASS
      and WISE photometry over ~5 million sources, yielding seven M-dwarf candidates; it used broadband filters,
      not 0.75-5 um spectra.
  - bibcode: 2022MNRAS.512.2988S
    register_id: REG-hephaistos-i-2022
    relation: Set upper limits on 100-1000 K partial Dyson spheres from Gaia DR2 and AllWISE colours, including
      ~2.7e5 stars within 100 pc; photometric colour cuts only, with no spectral-shape discrimination from dust.
  - bibcode: 2009ApJ...698.2075C
    register_id: REG-carrigan-iras-dyson-2009
    relation: Fitted 100-600 K blackbodies to IRAS LRS spectra (roughly 8-22 um) to search for partial or full Dyson
      spheres; it is spectral but at longer wavelengths and much shallower depth than SPHEREx.
  - bibcode: 2026arXiv260703619R
    relation: Showed that most Hephaistos candidates' mid-IR excesses are likely background dust-obscured galaxy
      contamination, a confounder the card must handle, but it does not test the spectral-shape claim.
  what_would_make_it_open: A SPHEREx R~35-130 analysis would add a measurement of the 2-5 um excess spectral shape
    for G<12 stars within 100 pc, and a test of whether any smooth blackbody-like excess is separable from debris-disc
    dust features, which broadband WISE/2MASS photometry and longer-wavelength IRAS spectra could not resolve.
  queries_run:
  - Dyson sphere infrared excess candidates
  - partial Dyson swarm waste heat
  - Gaia WISE Dyson sphere search
  - SPHEREx infrared excess stars
  - warm debris disc near-infrared excess
