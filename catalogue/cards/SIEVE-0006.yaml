id: SIEVE-0006
version: 5
title: 'Optical luminosity deficit balanced by 3-5 um excess: an energy-conservation test with Gaia XP, spectroscopic
  surveys and SPHEREx'
claim: No main-sequence star with spectroscopic Teff/logg/[Fe/H] and Gaia parallax shows an optical bolometric deficit
  of more than 5 per cent that equals, within 30 per cent, its integrated 1-5 um infrared excess luminosity.
domain: technosignature
signature_class: thermal_waste_heat
observable: spectral_excess
timescale: snapshot
mechanism: 'A quasi-spherical swarm that intercepts fraction f of starlight removes f from the optical output seen
  at every viewing angle. It returns f as waste heat, so the deficit equals the infrared excess. Natural disks are
  flattened, so most sightlines give an excess without a deficit: the ratio of deficit to excess is near 0 face-on,
  while edge-on systems show strong reddening. For f=10 per cent the optical deficit is 0.11 mag against a radius-luminosity
  prediction precision of 0.03-0.05 mag for APOGEE/GALAH dwarfs with parallax error below 1 per cent. This assumes
  isotropic coverage and grey absorption by the structure.'
data_requirements:
  measured_quantity: ratio of optical bolometric deficit D (relative to isochrone-predicted luminosity) to infrared
    excess luminosity fraction E, both in per cent
  wavelength_um:
  - 0.33
  - 5
  spectral_resolution: Gaia XP R~30-100 plus SPHEREx R~35-130
  cadence: single epoch per instrument
  depth: G<13, Ks<11
  sample: ~2x10^5 dwarfs with APOGEE DR17, GALAH DR4 or LAMOST parameters and parallax error <1 per cent
candidate_archives:
- name: IRSA SPHEREx Quick Release
  access: boto3 unsigned S3, bucket nasa-irsa-spherex, prefixes qr2/ qr3/
  licence: public (IPAC/IRSA, NASA)
  volume_estimate: Order 10^7 image cutouts (2x10^5 stars x ~100 band-exposures). At ~50-150 kB per row-range read
    this is roughly 0.5-2 TB of S3 range reads (to verify); best run in AWS us-east-1.
- name: Gaia DR3
  access: ESA Gaia TAP gaiadr3.gaia_source and gaiadr3.xp_sampled_mean_spectrum
  licence: ESA Gaia data, CC BY-SA 3.0 IGO (acknowledge ESA/Gaia/DPAC)
  volume_estimate: gaia_source selection ~2x10^5 rows, tens of MB. XP sampled spectra ~2x10^5 x 343 samples x flux/error,
    about 1 GB.
- name: APOGEE DR17
  access: SDSS SAS file allStar-dr17-synspec_rev1.fits
  licence: public (SDSS; specific terms to verify)
  volume_estimate: single allStar file, several GB (to verify)
- name: GALAH DR4 / LAMOST DR10
  access: GALAH DR4 allstar FITS via datacentral.org.au; LAMOST DR10 catalog via dr10.lamost.org
  licence: public (SDSS; specific terms to verify)
  volume_estimate: single allStar file, several GB (to verify)
- name: Bayestar19 3D dust
  access: python dustmaps package, bayestar query
method: For dwarfs with APOGEE/GALAH/LAMOST parameters and parallax_over_error>100, predict L from isochrones (MIST)
  given Teff, logg and [Fe/H]. Measure observed bolometric flux by integrating Gaia XP + 2MASS + SPHEREx. Correct
  for extinction with 3D dust maps. Compute the deficit fraction D=1-L_obs/L_pred and the excess fraction E from
  the SPHEREx 1-5 um residual extrapolated with a blackbody. Search for D~E>0.05 and test grey-versus-chromatic
  dimming across XP wavelengths.
confounders:
- name: Interstellar extinction underestimated by the 3D dust map
  exclusion: Interstellar dust gives chromatic dimming (R_V~3.1) visible across Gaia XP 0.33-1.05 um, while the
    hypothesis predicts grey dimming. Restrict to d<200 pc where E(B-V)<0.02.
- name: Wrong spectroscopic parameters or unresolved binary shifting the predicted luminosity
  exclusion: Binaries make stars overluminous, not underluminous. Require agreement of Teff/logg between two surveys
    and Gaia RUWE<1.2 with no RV variability in APOGEE visits.
- name: Edge-on circumstellar disk producing both dimming and excess
  exclusion: Edge-on disks give chromatic reddening and scattered-light polarisation. Gaia XP slope and the absence
    of a W3/W4 cold component discriminate.
- name: Isochrone luminosity systematics (age, Teff zero-point, [Fe/H], alpha)
  exclusion: 'Not addressed by the card. Replace the isochrone prediction with an empirical estimate: L from Gaia
    parallax plus an IRFM or angular-diameter Teff. Require the deficit to persist when the age is marginalised
    and when APOGEE, GALAH and LAMOST parameters are swapped. Calibrate the D distribution on a control sample of
    interferometrically characterised dwarfs (threshold to calibrate on a control sample). Discard stars whose D
    is consistent with the ZAMS-to-turnoff width. Data: APOGEE DR17 / GALAH DR4 / LAMOST DR10 overlaps; JMMC stellar
    diameter catalogue and interferometric benchmarks; Gaia FLAME parameters; MIST plus a second isochrone grid
    (PARSEC) [G4 excludable: partly]'
- name: Starspots and two-temperature photospheres in active dwarfs
  exclusion: 'Not in the card. Flag activity using four indicators: X-ray luminosity, Gaia RVS Ca II IRT activity
    index, TESS/ZTF rotation amplitude, and APOGEE/LAMOST emission cores. Exclude or separately calibrate active
    and fast-rotating stars. Test whether a two-component spot model fits Gaia XP plus SPHEREx as well as a grey
    screen. A residue remains for low-amplitude, pole-on spotted stars. Data: eROSITA eRASS1 and ROSAT 2RXS; Gaia
    DR3 activityindex_espcs and vbroad; TESS and ZTF light curves; GALEX NUV [G4 excludable: partly]'
- name: SPHEREx and WISE blending with background or companion sources
  exclusion: 'Not in the card. Check the neighbourhood with Gaia DR3 sources within about 15 arcsec and with deeper
    optical and near-infrared imaging. Require a consistent excess in unWISE/CatWISE W1-W2 with clean cc_flags (all
    zeros) and ext_flg=0. Inspect the SPHEREx PSF residual for extended or offset emission. Require consistency
    across independent SPHEREx exposures. Data: Gaia DR3; Legacy Surveys DR10 / Pan-STARRS1 images; unWISE and CatWISE2020;
    AllWISE cc_flags and ext_flg; Spitzer IRAC archival images where available; 2MASS cc_flg [G4 excludable: partly]'
- name: Photospheric model mismatch at 3-5 um
  exclusion: 'Not in the card. Build empirical photospheric templates by binning SPHEREx spectra of control stars
    in Teff, logg and [Fe/H]. Require the excess to be smooth and continuum-like rather than tied to molecular band
    positions. Compare results across PHOENIX, MARCS and Kurucz grids. Thresholds to calibrate on a control sample.
    Data: SPHEREx Quick Release spectra of matched control dwarfs; WISE W1-W2 colour-Teff loci; IRTF spectral library
    [G4 excludable: partly]'
- name: 'Large-grain (grey) circumstellar dust: extreme debris disks, dippers, collisional clouds'
  exclusion: 'The card''s grey-versus-chromatic test does not exclude this. Look for variability, since dust clouds
    produce dips and infrared variability: Gaia epoch photometry, TESS, ZTF, ASAS-SN, and NEOWISE multi-epoch W1/W2.
    Look for a silicate or cold component at 12-22 um, and for youth indicators such as Li and kinematic association
    membership. A residue remains for static, optically thin, quasi-spherical large-grain envelopes. Data: Gaia
    DR3 epoch photometry and phot_variable_flag; NEOWISE-R single-exposure database; TESS/ZTF/ASAS-SN; AllWISE W3/W4;
    GALAH/APOGEE Li abundances; moving-group catalogues [G4 excludable: partly]'
- name: Unresolved companion distorting spectroscopic parameters
  exclusion: 'The card''s RUWE<1.2 plus RV check is partly adequate. Add Gaia ipd_frac_multi_peak and ipd_gof_harmonic_amplitude,
    non_single_star, Hipparcos-Gaia proper-motion anomaly, APOGEE VSCATTER from multiple visits, and Gaia rv_amplitude_robust.
    Low-mass, wide-separation or long-period companions can still escape these checks. Data: Gaia DR3 gaia_source
    and nss tables; Hipparcos-Gaia catalogue of accelerations; APOGEE DR17 allVisit; archival AO/speckle imaging
    [G4 excludable: partly]'
- name: Calibration and instrumental artefacts (Gaia XP, SPHEREx Quick Release)
  exclusion: 'Not in the card. Require consistency across multiple SPHEREx exposures and spacecraft orientations.
    Require agreement with WISE W1/W2 and 2MASS photometry. Use Gaia G/BP/RP photometry as a cross-check on XP integrals.
    Apply magnitude-dependent corrections derived from control stars (threshold to calibrate on a control sample).
    Data: Multi-epoch SPHEREx QR2/QR3 cutouts; AllWISE/unWISE; 2MASS ph_qual; Gaia DR3 phot_bp_rp_excess_factor
    [G4 excludable: yes]'
- name: Underestimated interstellar extinction
  exclusion: 'The card''s restriction to d<200 pc plus the chromatic XP slope test is adequate. Interstellar dust
    cannot also supply the 3-5 um excess. Cross-check against a second 3D map and against diffuse interstellar band
    or Na D absorption in survey spectra. Data: Bayestar19; Lallement/STILISM 3D maps; Gaia XP slopes; APOGEE DIB
    measurements [G4 excludable: yes]'
- name: Edge-on protoplanetary or transitional disk / YSO
  exclusion: 'The card''s chromatic-slope test plus W3/W4 check is mostly adequate. Add the following: accretion
    and emission-line indicators (H-alpha, Br-gamma in APOGEE), Li and youth flags, membership in star-forming regions,
    and variability. Restricting the sample to main-sequence dwarfs within 200 pc further limits this. Data: AllWISE
    W3/W4; APOGEE spectra; SIMBAD YSO classes; Gaia variability; star-forming region membership catalogues [G4 excludable:
    yes]'
- name: Look-elsewhere coincidence in the D-E plane
  exclusion: 'Not in the card. Preregister the cuts. Estimate the false-coincidence rate by scrambling D and E across
    stars and by injection-recovery tests on control samples. Require the D~E significance to exceed this empirical
    null. Data: The survey sample itself (scrambled pairings); matched control samples [G4 excludable: yes]'
novelty:
  status: partly_done
  confidence: medium
  rationale: Zackrisson et al. 2018 searched for optically subluminous stars, flagged by parallax distances shorter
    than their spectrophotometric distances, in RAVE DR5 × Gaia DR1, and checked infrared excess only for one follow-up
    star. The Hephaistos papers, Contardo et al. 2024 and the earlier WISE/IRAS searches test only the infrared-excess
    half, using WISE photometry. None of the listed abstracts reports a population-level test that requires the
    optical deficit to equal the integrated 1-5 um excess luminosity, nor a grey-versus-chromatic dimming test with
    Gaia XP and SPHEREx. The card is therefore a joint, energy-balance version of two halves that have each been
    tested separately with older or different data.
  closest_prior:
  - bibcode: 2018ApJ...862...21Z
    register_id: REG-zackrisson-seti-gaia-2018
    relation: Tested optical subluminosity (spectrophotometric distance exceeding parallax distance) in RAVE DR5
      × Gaia DR1 and found no infrared excess in its follow-up star; it did not quantify a deficit-equals-excess
      balance and used neither XP spectra nor 1-5 um spectrophotometry.
  - bibcode: 2024MNRAS.531..695S
    register_id: REG-hephaistos-ii-2024
    relation: Searched for infrared excess fitted with a photosphere-plus-blackbody model in about 5 million Gaia
      DR3/2MASS/WISE sources; it did not compare against an optical luminosity deficit, and its candidates were
      later attributed to background galaxies.
  - bibcode: 2024AJ....168..157C
    relation: Data-driven search for W1/W2 excess in about 4.9 million FGK main-sequence stars, reporting fractional
      excess luminosities of 0.005-0.1, with no matched optical deficit test.
  - bibcode: 2024arXiv240911447B
    relation: Points out that such structures could make stars appear anomalously faint in optical catalogues, which
      motivates a deficit-based search, but does not carry out one.
  what_would_make_it_open: No listed work measures, per star, both the isochrone-relative optical bolometric deficit
    and the integrated 1-5 um excess luminosity (Gaia XP + SPHEREx) for spectroscopic dwarfs and tests whether D
    equals E together with grey dimming.
  queries_run:
  - Dyson sphere luminosity deficit infrared excess
  - Dyson sphere candidates Gaia 2MASS WISE
  - underluminous main-sequence stars infrared excess
  - SPHEREx infrared excess stars
  - Gaia parallax bolometric flux luminosity discrepancy dwarfs
