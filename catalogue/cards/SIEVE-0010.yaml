id: SIEVE-0010
version: 2
title: Kiloparsec-scale 4-5 um excess patches uncorrelated with star formation in SPHEREx maps of the LMC, SMC,
  M31 and M33
claim: In pixel-resolved SPHEREx maps of the LMC, SMC, M31 and M33, the 4-5 um continuum excess over a stellar continuum
  extrapolated from 1-2 um shows no spatially contiguous region larger than 100 pc whose excess exceeds 20 per cent
  once PAH 3.3 um, Br-alpha 4.05 um and Spitzer 24 um-traced hot dust are removed.
domain: technosignature
signature_class: thermal_waste_heat
observable: spectral_excess
timescale: snapshot
mechanism: A civilization expanding through a galaxy from a single origin would occupy a contiguous volume before
  it filled the disk. With expansion speeds of 0.01-0.1c and a 10 kpc disk, the expansion phase lasts 1e5-1e6 yr.
  A partly filled galaxy then shows a waste-heat patch whose edges do not follow gas, star formation or stellar
  mass. Reprocessing 5 per cent of local starlight at 400 K raises the 4.5 um surface brightness by about 0.05 x
  (4000/400)^4 x [B_nu(400 K)/B_nu(4000 K)], roughly 24 per cent. SPHEREx 6.2 arcsec pixels resolve 1.5 pc in the
  LMC and 23 pc in M31. This assumes expansion is slow compared with SPHEREx-epoch light travel but fast compared
  with galactic rotation shear (about 1e8 yr). The operator transfers the integrated galaxy waste-heat search to
  spatially resolved spectral maps.
data_requirements:
  measured_quantity: per-pixel 4-5 um surface-brightness excess over a 1-2 um-extrapolated stellar continuum, in
    per cent, after PAH, Br-alpha and 24 um-correlated dust are removed
  wavelength_um:
  - 0.75
  - 5
  spectral_resolution: R 35-130 (SPHEREx native)
  cadence: snapshot, all QR visits co-added
  depth: surface-brightness S/N >= 10 per band in 3x3-pixel bins over the stellar disk
  sample: 'four Local Group galaxies: LMC, SMC, M31, M33'
candidate_archives:
- name: IRSA SPHEREx Quick Release
  access: boto3 with signature_version=UNSIGNED, bucket nasa-irsa-spherex (us-east-1), prefixes qr2/ and qr3/ spectral
    images covering each galaxy footprint
- name: Spitzer SAGE (LMC/SMC) and M31/M33 IRAC+MIPS mosaics
  access: IRSA Spitzer Enhanced Imaging Products via IRSA SIA service
- name: GALEX FUV/NUV tiles
  access: MAST GALEX via astroquery.mast
- name: Gaia DR3
  access: ESA Gaia TAP gaiadr3.gaia_source for foreground star masks
method: Mosaic SPHEREx QR spectral images over each galaxy. Mask Gaia DR3 foreground stars. Per pixel, fit an old-stellar-population
  continuum to the 1-2 um bands, plus Gaussian templates for PAH 3.3 um and Br-alpha 4.05 um. Regress the remaining
  4-5 um excess against Spitzer 24 um, GALEX FUV and H-alpha maps. Map the regression residuals and run a friends-of-friends
  search for contiguous regions above 20 per cent excess. Test each region's significance against 1000 randomly
  rotated and translated residual maps.
confounders:
- name: Warm dust in star-forming complexes and HII regions
  exclusion: Regress against Spitzer 24 um, H-alpha and GALEX FUV. A residual patch that coincides with any of these
    tracers within 3 pixels is labelled star formation.
- name: Concentrations of dusty AGB and carbon stars in intermediate-age populations
  exclusion: Overlay SAGE AGB catalogues and Gaia DR3 long-period variables. AGB-driven excess is spatially clumpy
    at the resolved-star level in the LMC/SMC and correlates with known AGB density.
- name: Zodiacal light and SPHEREx detector or flat-field residuals
  exclusion: Require the patch to persist between independent QR visits taken six months apart at different ecliptic
    geometry, and to have no counterpart in detector coordinates.
- name: Background galaxy clusters seen through the disk
  exclusion: Cross-match with Legacy Survey and 2MASS extended source catalogues. Background-galaxy excess appears
    as point-like knots with redshifted PAH features.
novelty:
  status: partly_done
  confidence: medium
  rationale: 'The waste-heat hypothesis behind the card has been tested only at the level of whole galaxies: the
    Ĝ papers use WISE mid-IR colours of about 1e5 galaxies (2014ApJ...792...27W, 2015ApJS..217...25G), and Curtis
    et al. 2026 fit SPS models with a Dyson-sphere component to 129 galaxies. Garrett 2015 proposed comparing resolved
    kpc-scale mid-IR and radio images to find partly occupied galaxies but did not run that test, and Curtis et
    al. 2026 list resolved fitting as a future step. No listed work maps a spatially resolved 4-5 um excess in the
    LMC, SMC, M31 or M33 with SPHEREx spectra and star-formation tracers removed. The card is therefore a resolved,
    spectrally decomposed extension of a tested integrated-galaxy claim, and also runs a test that has only been
    proposed.'
  closest_prior:
  - bibcode: 2015ApJS..217...25G
    register_id: REG-g-hat-wise-galaxies-2014-2015
    relation: Searched WISE extended-source photometry of about 1e5 galaxies for integrated mid-IR waste-heat excess;
      it used whole-galaxy colours, not resolved sub-kpc maps of Local Group galaxies with PAH, Br-alpha and 24
      um dust removed.
  - bibcode: 2015A&A...581L...5G
    relation: Proposed comparing resolved kpc-scale mid-IR and radio images to identify partial Type II/III civilisations
      but did not perform a resolved analysis; the card would run a spatially resolved version with SPHEREx.
  - bibcode: 2026arXiv260812458C
    relation: Set per-galaxy integrated limits on Dyson-swarm covering fraction in 129 galaxies using SPS fits,
      and proposes resolved fitting as a future step; it does not include resolved patch searches in Local Group
      galaxies.
  - bibcode: 2014ApJ...792...27W
    register_id: REG-g-hat-wise-galaxies-2014-2015
    relation: Set up the waste-heat formalism and gave a zeroth-order null result for Type III civilisations from
      integrated WISE photometry; the test is not spatially resolved.
  what_would_make_it_open: A friends-of-friends search for contiguous regions larger than 100 pc with more than
    20 per cent 4-5 um excess in resolved SPHEREx spectral maps of the LMC, SMC, M31 and M33, after removing PAH,
    Br-alpha and 24 um-traced dust, has not been done by any listed work and would be the new contribution.
  queries_run:
  - waste heat Kardashev galaxies infrared
  - resolved waste heat Andromeda civilization
  - near-infrared excess emission Magellanic Clouds
  - SPHEREx Local Group galaxies
  - hot dust excess M31 M33
