id: SIEVE-0005
version: 4
title: 'Host-luminosity-independent excess temperature: a population test of 3-5 um excesses across the SPHEREx
  stellar sky'
claim: For stars with 3-5 um excess in SPHEREx, the fitted excess temperature correlates with host luminosity as
  T proportional to L^(0.1-0.25), with no subpopulation clustered within 50 K of a single temperature across a factor
  of 100 in L.
domain: technosignature
signature_class: thermal_waste_heat
observable: spectral_excess
timescale: snapshot
mechanism: 'Natural dust temperature follows the grain''s equilibrium distance and composition. Across a population
  this gives a broad T distribution that tracks L^0.25 at fixed radius, except at the ~1500 K sublimation rim. An
  engineered radiator temperature is set by the design: maximum work per unit radiator area, a material limit, or
  a ~300-400 K biological/electronic operating point. That design holds regardless of host star. If 10 per cent
  of excess sources were engineered at 350+-30 K, a sample of 1000 excesses would show a 100-source spike in a 60
  K bin above a smooth natural distribution of ~20 per bin.'
data_requirements:
  measured_quantity: best-fit excess blackbody temperature T_ex (K) and luminosity fraction f, versus host bolometric
    luminosity L*
  wavelength_um:
  - 0.75
  - 5
  spectral_resolution: R~35-130
  cadence: single all-sky pass
  depth: stars with Ks<13
  sample: all Gaia DR3 stars with SPHEREx 4-5 um excess >5 sigma, expected 10^3-10^4
candidate_archives:
- name: IRSA SPHEREx Quick Release
  access: boto3 unsigned S3, bucket nasa-irsa-spherex, prefixes qr2/ qr3/
- name: Gaia DR3
  access: ESA Gaia TAP gaiadr3.astrophysical_parameters (lum_flame, teff_gspphot)
- name: AllWISE
  access: IRSA TAP allwise_p3as_psd for W3/W4 long-wavelength anchors
method: 'Build an all-sky SPHEREx excess catalog: forced photometry on Gaia DR3 stars with photospheric models from
  XP spectra, keeping excess >5 sigma at 4-5 um. Fit T_ex and the luminosity fraction f with an MCMC that marginalises
  over photospheric uncertainty. Plot T_ex against L* from Gaia parallax plus bolometric correction. Search for
  overdensities in T_ex at fixed T using kernel density with injection-recovery to model selection effects.'
confounders:
- name: Selection effect from the SPHEREx wavelength window favouring T~400-1000 K
  exclusion: Run injection-recovery of blackbodies with uniform T across 200-2000 K into real spectra. Divide the
    observed T histogram by the recovery function.
- name: Dust sublimation rim fixing T near 1300-1500 K
  exclusion: The rim temperature is known and sits above the 300-600 K band of interest. Treat it as a separate
    component in the mixture model.
- name: Brown dwarf or M-dwarf companions with fixed Teff mimicking a fixed-T excess
  exclusion: Companions show H2O/CH4/CO bands in SPHEREx spectra. Exclude sources whose residual is better fit by
    BT-Settl atmospheres than by blackbodies.
novelty:
  status: open
  confidence: medium
  rationale: The card measures the distribution of best-fit 3-5 um excess temperature against host luminosity for
    an all-sky population, using SPHEREx 0.75-5 um spectral shape, and tests whether any subpopulation clusters
    at a fixed temperature independent of L. Hephaistos I/II (2022MNRAS.512.2988S, 2024MNRAS.531..695S) and Carrigan
    (2009ApJ...698.2075C) searched for individual waste-heat candidates or set prevalence limits from WISE/IRAS
    photometry, which shows that an excess exists but cannot constrain the shape of a hot 3-5 um excess. None of
    them examined the T_ex-versus-L* population distribution. Chen et al. (2014ApJS..211...25C) and Pawellek et
    al. (2014ApJ...792...65P) found dust temperature rising with stellar mass or spectral type, but only for small,
    pre-selected debris-disk samples of cooler dust at wavelengths longer than 5 um, and they did not test for a
    host-independent temperature spike, so the card's population test is untested.
  closest_prior:
  - bibcode: 2014ApJS..211...25C
    relation: Measured one- and two-temperature dust fits in Spitzer IRS (5-35 um) spectra of ~500 debris disks
      and found higher grain temperatures around higher-mass stars; this is a cooler, pre-selected population with
      no test for fixed-temperature clustering or 3-5 um excesses.
  - bibcode: 2024MNRAS.531..695S
    register_id: REG-hephaistos-ii-2024
    relation: Ran SED fits of blackbody-plus-photosphere models to Gaia/2MASS/WISE photometry for 5 million stars
      to flag individual candidates; it did not measure the T_ex-versus-L* population distribution and had no 3-5
      um spectral shape.
  - bibcode: 2022MNRAS.512.2988S
    register_id: REG-hephaistos-i-2022
    relation: Set upper limits on the fraction of stars hosting 100-1000 K waste-heat excesses from Gaia-WISE colour
      cuts; it did not fit a temperature-luminosity relation or test for clustering.
  - bibcode: 2014ApJ...792...65P
    relation: Found dust temperature increasing toward earlier spectral types for 34 Herschel-resolved cold debris
      disks; this is far-IR cold dust in a tiny sample, not the 3-5 um excess population.
  queries_run:
  - Dyson sphere waste heat temperature
  - infrared excess Dyson sphere candidates Gaia WISE
  - warm debris disk temperature stellar luminosity
  - SPHEREx infrared excess stars
  - hot dust excess temperature distribution population
