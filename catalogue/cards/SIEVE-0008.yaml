id: SIEVE-0008
version: 2
title: 3-5 um excess in SPHEREx spectra of Kepler, K2, TESS and ZTF aperiodic dippers versus matched non-dipping
  control stars
claim: Stars with aperiodic dips deeper than 1 per cent in Kepler, K2, TESS or ZTF light curves show a median SPHEREx
  3.5-5 um flux excess over photospheric models that is at least 5 per cent higher than that of control stars matched
  in Gaia colour, magnitude and distance.
domain: technosignature
signature_class: thermal_waste_heat
observable: spectral_excess
timescale: snapshot
mechanism: An occulter large enough to block 1-20 per cent of a stellar disk absorbs starlight and must re-emit
  it. A swarm with a time-averaged covering factor of 1 per cent at 1 AU around an F3V star (L about 4.7 Lsun) equilibrates
  near 400 K. Its 4.6 um flux is about 0.01 x (6750/400)^4 x [B_nu(400 K)/B_nu(6750 K)], or roughly 20 per cent
  of the photosphere. This assumes the structures are opaque, absorb optical light, and radiate thermally rather
  than storing or beaming the energy. The operator moves the photometric dipper anomaly class into the SPHEREx spectral
  channel.
data_requirements:
  measured_quantity: flux excess at 3.5-5 um over a fitted photospheric model, in per cent, per star and as a population
    median difference (dippers minus matched controls)
  wavelength_um:
  - 0.75
  - 5
  spectral_resolution: R 35-130 (SPHEREx native, 102 bands)
  cadence: single epoch per star (snapshot); multiple QR visits co-added
  depth: S/N >= 20 per band at 4-5 um for stars with W2 < 12 mag
  sample: about 500 aperiodic dippers from Kepler, K2, TESS and ZTF, plus 10,000 Gaia-matched control stars
candidate_archives:
- name: IRSA SPHEREx Quick Release
  access: boto3 with signature_version=UNSIGNED, bucket nasa-irsa-spherex (us-east-1), prefixes qr2/ and qr3/ spectral
    image cubes
- name: Gaia DR3
  access: ESA Gaia TAP, tables gaiadr3.gaia_source and gaiadr3.xp_continuous_mean_spectrum
- name: MAST Kepler/K2/TESS light curves
  access: astroquery.mast Observations.query_criteria with obs_collection Kepler, K2, TESS
- name: AllWISE / CatWISE2020
  access: IRSA TAP tables allwise_p3as_psd and catwise_2020
method: Compile about 500 aperiodic dippers from published Kepler, K2, TESS and ZTF dipper lists, including Boyajian-type
  and shallow random-transiter cases. Exclude young-cluster members and YSOs flagged in SIMBAD. Draw 20 control
  stars per dipper, matched in Gaia BP-RP, G and parallax. Extract SPHEREx QR spectral-image photometry at the Gaia
  DR3 positions propagated to the SPHEREx epoch. Fit PHOENIX photospheres to Gaia XP plus 0.75-2 um SPHEREx bands,
  then compute the 3.5-5 um excess. Compare the dipper and control excess distributions with a two-sample Anderson-Darling
  test, and list individual dippers above 5 sigma.
confounders:
- name: Circumstellar dust from collisions or exocomets (natural dippers)
  exclusion: Dust shows chromatic dip depths in multiband photometry (ZTF g/r, TESS versus ground). Its 3-5 um excess
    is usually accompanied by a 10 um silicate or W3/W4 rise in AllWISE. Flag excesses with W3-W4 > 0.5 mag as dust-like.
- name: Young stellar object disks misclassified as field dippers
  exclusion: Remove stars with Gaia DR3 age or lithium indicators of youth, those inside star-forming-region boundaries,
    and those with H-alpha emission in LAMOST or Gaia RVS spectra.
- name: Blended background galaxy or red companion within SPHEREx 6.2 arcsec pixels
  exclusion: Check Gaia DR3 and Legacy Survey DR10 for neighbours within 12 arcsec. Require a centroid shift below
    1 arcsec between the 1 um and 4.5 um SPHEREx images.
- name: Photospheric model error for evolved or chemically peculiar stars
  exclusion: Apply the identical model pipeline to the matched controls, so systematic model offsets cancel in the
    difference statistic.
novelty:
  status: partly_done
  confidence: medium
  rationale: 'No listed work compares SPHEREx 3.5-5 um excess between a large multi-survey dipper sample and Gaia-matched
    controls. Closely related checks exist with WISE-band data for individual dippers or small samples: Tzanidakis
    et al. (2025) report no IR excess among 81 ZTF main-sequence dipper candidates, Boyajian et al. (2016) find
    no significant IR excess for KIC 8462852, and Marshall et al. (2023) find a NEOWISE 3.4/4.6 um excess for ASASSN-21qj.
    Ansdell et al. (2016) tested a dip-depth versus W2-excess relation, but only in young disk-hosting dippers,
    which the card excludes.'
  closest_prior:
  - bibcode: 2025ApJ...991..118T
    relation: Examined archival IR data for 81 ZTF main-sequence dipper candidates and reported no IR excess or
      variability, using WISE-era photometry, without a matched-control population statistic or SPHEREx spectra.
  - bibcode: 2016ApJ...816...69A
    relation: Found a positive correlation between dip depth and WISE-2 excess in ten young K2 dippers in Upper
      Sco/Oph, a YSO population the card explicitly excludes.
  - bibcode: 2023ApJ...954..140M
    relation: 'Single-star case: NEOWISE 3.4/4.6 um excess in the Boyajian-like dipper ASASSN-21qj, attributed to
      dust; no control comparison.'
  - bibcode: 2016MNRAS.457.3988B
    register_id: REG-boyajian-star-kepler-dips-2016-2018
    relation: SED fitting of KIC 8462852 showed no significant IR excess; this is one object, the F3V star used
      in the card's own mechanism estimate.
  what_would_make_it_open: An analysis would need to deliver a population-level median 3.5-5 um excess difference,
    measured with SPHEREx spectrophotometry, between about 500 Kepler/K2/TESS/ZTF field dippers and Gaia-matched
    controls, which no listed work provides.
  queries_run:
  - Dyson swarm infrared excess dipping stars
  - aperiodic dippers infrared excess circumstellar dust
  - SPHEREx spectra infrared excess stars
  - Boyajian star infrared excess WISE
  - waste heat transiting megastructures
