id: SIEVE-0007
version: 2
title: Rest-frame 3-5 um waste-heat bump in SPHEREx spectra of z<0.1 galaxies, tracked through redshift to reject
  instrumental features
claim: Among 2MASS XSC galaxies with spectroscopic z<0.1 and no AGN or star-formation signatures, none shows a rest-frame
  3.5-5 um excess above 20 per cent over a stellar-population model that moves with redshift and lacks a 3.29 um
  PAH feature.
domain: technosignature
signature_class: thermal_waste_heat
observable: spectral_excess
timescale: snapshot
mechanism: A galaxy-spanning civilization that reprocesses fraction f of starlight at 500 K adds an excess at rest
  4.5 um of about 8f relative to a ~4000 K old stellar population. At 300 K the excess is about 0.9f. So f=5 per
  cent at 500 K gives a 40 per cent bump. This assumes uniform reprocessing across the galaxy and grey thermal emission.
  WISE broadband colours mix this bump with AGN hot dust, while SPHEREx spectra place the bump at a rest-frame wavelength
  that shifts with z.
data_requirements:
  measured_quantity: rest-frame 3.5-5.0 um flux excess over best-fit stellar population model, in per cent, and
    3.29 um PAH equivalent width
  wavelength_um:
  - 0.75
  - 5
  spectral_resolution: R~35-130
  cadence: single pass
  depth: galaxies with Ks_ext<13.5
  sample: ~5x10^4 2MASS XSC galaxies with spectroscopic z<0.1, quiescent and non-AGN
candidate_archives:
- name: IRSA SPHEREx Quick Release
  access: boto3 unsigned S3, bucket nasa-irsa-spherex, prefixes qr2/ qr3/
- name: 2MASS Extended Source Catalog
  access: IRSA TAP table fp_xsc
- name: SDSS DR17 / DESI DR1
  access: SkyServer SpecObj and galSpecLine tables; DESI zcatalog via data.desi.lbl.gov
- name: AllWISE
  access: IRSA TAP allwise_p3as_psd
method: Select 2MASS XSC galaxies with SDSS/6dF/DESI redshifts. Remove AGN by BPT classification, WISE W1-W2>0.5
  and X-ray matches, and remove strong star formation by H-alpha EW>5 A. Extract matched-aperture SPHEREx spectra
  and fit stellar population synthesis (age, metallicity, TP-AGB). Fit residuals in the rest frame and stack by
  redshift bin. A real bump stays fixed in rest wavelength; an instrument feature stays fixed in observed wavelength.
confounders:
- name: Obscured AGN hot dust torus
  exclusion: Use BPT line ratios, WISE W1-W2 colour, and a Chandra Source Catalog / eROSITA DR1 X-ray match. A torus
    also rises steeply into W3/W4.
- name: TP-AGB stars in intermediate-age populations raising the 2-5 um continuum
  exclusion: TP-AGB light shows CO 2.3 um and H2O 1.9 um absorption visible in SPHEREx spectra and correlates with
    spectroscopic age indices (Dn4000, H-delta).
- name: Aperture mismatch for extended galaxies across wavelength-dependent PSF
  exclusion: Use fixed physical apertures convolved to a common PSF. Test on galaxy pairs at the same z with different
    sizes and check for size-dependent residuals.
novelty:
  status: partly_done
  confidence: high
  rationale: The claim is that quiescent galaxies show no galaxy-wide waste-heat excess over a stellar-population
    model, and that claim has been tested before with other data. The Ĝ papers II–III (2014ApJ...792...27W, 2015ApJS..217...25G)
    set mid-IR limits on starlight reprocessing for ~1e5 galaxies using WISE broadband photometry. Ĝ V (2026arXiv260812458C)
    fitted SPS models with a Dyson-swarm component to 129 nearby galaxies and found none preferring the component,
    with median α<0.3% in quiescent non-AGN hosts. No listed work uses SPHEREx R~35–130 spectra, a rest-frame 3.5–5
    µm residual tracked through redshift to reject instrumental features, a 3.29 µm PAH veto, or a ~5×10^4 quiescent
    2MASS XSC sample.
  closest_prior:
  - bibcode: 2026arXiv260812458C
    relation: SPS fitting with a Dyson-swarm component and injection-recovery on 129 nearby galaxies, including
      quiescent non-AGN hosts, with per-galaxy limits α<0.3% for T≳100 K; tests the same model-excess claim on a
      far smaller sample with broadband SEDs rather than SPHEREx spectra.
  - bibcode: 2015ApJS..217...25G
    register_id: REG-g-hat-wise-galaxies-2014-2015
    relation: Recalibrated WISE extended-source photometry for ~1e5 galaxies finds none reprocessing >85% of starlight
      into the mid-IR; same population-level claim, but broadband colours only reach far higher reprocessing fractions
      and cannot separate a 3.5–5 µm excess from AGN dust.
  - bibcode: 2014ApJ...792...27W
    register_id: REG-g-hat-wise-galaxies-2014-2015
    relation: Framework turning WISE mid-IR photometry into waste-heat limits, with a zeroth-order null result for
      Type III civilizations; photometric and much coarser than the card's spectral test.
  - bibcode: 2021MNRAS.507.3761C
    relation: Searches z<0.2 LoTSS galaxies for a mid-IR (22 µm) excess relative to the radio continuum (high q
      values), giving 2 unconfirmed candidates; different observable and wavelength.
  what_would_make_it_open: No listed work delivers a SPHEREx spectral measurement of rest-frame 3.5–5 µm excess
    over SPS models for ~5×10^4 quiescent z<0.1 galaxies, stacked by redshift to separate rest-frame from observed-frame
    features, with a PAH 3.29 µm veto and a population limit reaching f of a few per cent at 300–500 K.
  queries_run:
  - Kardashev civilizations galaxies waste heat infrared
  - Dyson sphere galaxies mid-infrared excess
  - SPHEREx galaxy spectra near-infrared
  - early-type galaxies near-infrared excess hot dust
  - TP-AGB stars galaxy spectral energy distribution infrared
