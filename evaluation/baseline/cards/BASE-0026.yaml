title: Vegetation red edge in reflected-light spectra of terrestrial exoplanets
claim: Some terrestrial exoplanets show a red-edge-like step in their reflectance spectrum caused by photosynthetic
  pigments of surface organisms.
domain: biosignature
signature_class: surface_albedo
observable: spectroscopy
timescale: snapshot
mechanism: The vegetation red edge is a well-known spectral reflectance signature of plant leaves. It has been shown
  to be detectable in observations of Earth from the Galileo spacecraft and in the Earthshine spectrum. Open questions
  are whether a red edge from vegetation or cyanobacteria can be expected on another planet and at what wavelengths,
  and how atmospheric opacity and surface conditions affect it. Direct imaging will give first access to surface
  reflectance biosignatures such as the red edge.
method: Reflectance spectroscopy of directly imaged planets.
