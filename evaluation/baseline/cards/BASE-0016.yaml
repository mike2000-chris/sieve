id: BASE-0016
version: 2
title: Lurker probes on Earth co-orbital and other stable solar-system orbits in radar, optical and infrared data
claim: At least one object on an Earth co-orbital orbit or at a stable Lagrange point is an artificial probe, recognisable
  by radar imaging, anomalous morphology or reflectivity, infrared excess or radio emission.
domain: technosignature
signature_class: artificial_structure_geometry
observable: imaging
timescale: snapshot
mechanism: Active or remnant probes ('lurkers') could reside at gravitationally stable Lagrange points or on horseshoe,
  tadpole or quasi-satellite orbits; Earth co-orbital objects approach Earth closely and are assumed to be natural.
  The source states that co-orbital objects have not yet been pinged or imaged by planetary radar. Optical observations
  could show anomalous morphological or reflective features, infrared observations an excess from waste energy of
  a functional artefact, and radio observations communicative signals or reflected terrestrial interference.
method: Planetary radar ranging and imaging of co-orbital objects; passive optical, infrared and radio observations
  of known near-Earth objects and stable orbits; comparison of all-sky radio transient images (e.g. Long Wavelength
  Array, 10-90 MHz) with positions of known satellites to identify anomalies.
