id: BASE-0004
version: 2
title: Infrared excess from waste heat of circumstellar technology in WISE and Gaia catalogues of nearby stars
claim: Some nearby stars, in particular old stars, show a mid-infrared excess that is not explained by circumstellar
  dust, as expected if technology around the star re-radiates intercepted starlight as waste heat.
domain: technosignature
signature_class: thermal_waste_heat
observable: spectral_excess
timescale: snapshot
mechanism: Waste heat is an inevitable consequence of energy use. In the AGENT parameterisation (Wright et al. 2014)
  technology blocks a fraction of the starlight and re-radiates a fraction as heat at a characteristic temperature;
  the infrared brightening is a significantly stronger signal than the optical decrement and is more omnidirectional
  and persistent.
candidate_archives:
- name: WISE
  access: ''
- name: Gaia
  access: ''
- name: JWST (mid-infrared spectroscopy)
  access: ''
method: Build a nearly complete catalogue of nearby stars with infrared excesses from WISE and Gaia; identify the
  origin of the excesses with JWST mid-infrared spectroscopy; compute upper limits on circumstellar energy use.
  Searches for debris disks can be modified slightly to become searches for waste heat.
confounders:
- name: Circumstellar dust (debris disks)
  exclusion: 'Spectra, high-resolution imagery, lack of far-infrared emission, and age: debris disks are often found
    around 10-1000 Myr old stars and almost never around multi-Gyr old stars.'
