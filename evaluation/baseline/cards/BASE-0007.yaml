id: BASE-0007
version: 3
title: Industrial compounds (CF4, CCl3F and other CFCs) in mid-infrared spectra of terrestrial exoplanet atmospheres
claim: Some terrestrial exoplanet atmospheres contain industrial compounds such as CF4 and CCl3F at abundances that
  produce detectable mid-infrared absorption.
domain: technosignature
signature_class: atmospheric_chemistry
observable: spectroscopy
timescale: snapshot
mechanism: 'Atmospheric pollution is one of the most obviously artificial alterations of Earth''s observable characteristics,
  whether as an unwanted by-product of industry or as deliberate geoengineering. Order of magnitude (Lin et al.
  2014): CF4 and CCl3F could be detectable with less than 2 days of JWST integration; for an Earth-like planet around
  a white dwarf, one day of JWST at S/N 5 requires concentrations 10 times the present Earth level. CCl3F has a
  spectral feature about 0.4 um wide, needing R > 30; CFC-11 and CFC-12 absorb at 8-14 um. Such compounds are potent
  greenhouse gases, so synthetic spectra must account for the associated warming.'
data_requirements:
  wavelength_um:
  - 8
  - 14
  spectral_resolution: R > 30 for CCl3F; R > 100 for the narrowest feature discussed
  depth: about 1-2 days of JWST integration in the white-dwarf host case
method: Forward modelling of technosignature spectra, with climate modelling for greenhouse-active artificial constituents
  and a range of planetary conditions, then comparison with transmission and reflection spectra of exoplanet atmospheres
  (existing data and upcoming missions).
