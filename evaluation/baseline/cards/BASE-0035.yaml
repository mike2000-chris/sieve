id: BASE-0035
version: 3
title: Enantiomeric excess and isomer selectivity of organic molecules in Martian samples
claim: Some organic molecules preserved in Martian samples show an enantiomeric excess, a diastereoisomeric preference
  or a restricted subset of structural isomers.
domain: solar_system_insitu
signature_class: insitu_composition
observable: mass_spectrometry
timescale: snapshot
mechanism: Life synthesises exclusively one enantiomer of chiral molecules (l-amino acids, d-ribose), biosynthesises
  compounds with several chiral centres as a unique stereoisomer, and uses a limited subset of the chemically feasible
  structural isomers. After death, racemisation erodes the enantiomeric enrichment at a rate that depends on dose,
  temperature, pH and duration.
confounders:
- name: Abiotic enantioenrichment
  exclusion: l-excesses of some amino acids in the Tagish Lake meteorite show non-biological processes can produce
