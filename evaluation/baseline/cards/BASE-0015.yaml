- name: Lunar Reconnaissance Orbiter images
  access: ''
method: Automatic processing of the image set; development of such AI is a low-cost initial activity, and an unsupervised
  machine-learning approach (Lesnikowski et al. 2020) and an earlier discussion of examining lunar images (Davies
  and Wagner 2013) exist.
