id: BASE-0015
version: 3
title: Non-terrestrial artefacts on the lunar surface in Lunar Reconnaissance Orbiter images
claim: At least one non-terrestrial artefact is present on the lunar surface and identifiable in Lunar Reconnaissance
  Orbiter images.
domain: technosignature
signature_class: artificial_structure_geometry
observable: imaging
timescale: snapshot
mechanism: Artefacts on a planetary surface, functional or defunct, could be identified by analysis of surface images;
  the lifetime of inactive artefacts is limited by the resurfacing timescale of the body. LRO has been in low lunar
  orbit since 2009 and has taken more than 2 million images at sub-metre resolution (a few sites at 0.5 m), enough
  to show boot prints, and the vast majority have not been inspected by eye.
data_requirements:
  depth: sub-metre image resolution
  sample: more than 2 million LRO images
