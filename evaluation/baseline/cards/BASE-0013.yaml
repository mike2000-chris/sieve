mechanism: By analogy with human night-time city illumination, artificial light sources might be detectable on the
  night sides of exoplanets with near-future technology (NASA report, citing Schneider et al. 2010 and Loeb and
  Turner 2012). Socas-Navarro et al. list photometric and spectroscopic searches for night-time illumination among
  new searches on existing data and data from upcoming direct-imaging missions. No flux estimate is given in the
  passages used.
method: Forward modelling of the expected observables and comparison with exoplanet photometry and spectroscopy;
