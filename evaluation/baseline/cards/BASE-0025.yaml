timescale: snapshot
mechanism: N2O is produced by Earth's biosphere through incomplete denitrification of nitrate to N2. It has been
  proposed as a strong biosignature because its abiotic sources are small on modern Earth and it has potentially
  detectable spectral features. The pre-industrial concentration was about 270 ppb. Euxinic Proterozoic oceans may
  have allowed biogenic N2O to build up to higher concentrations, and photochemical models show N2O building up
  to higher concentrations around M dwarfs than on an Earth-Sun analogue for the same source flux.
