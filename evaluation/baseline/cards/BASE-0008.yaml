id: BASE-0008
version: 2
title: Subcontinent-size artificial structures resolved by multi-band inversion of exoplanet reflected light curves
claim: Some exoplanets carry subcontinent-size, highly reflective or highly absorptive artificial structures that
  are recognisable in multi-band inversions of the planet's reflected light curve by their contrast to the natural
  environment and their regular substructure or unnatural shape.
domain: technosignature
signature_class: artificial_structure_geometry
observable: time_series
timescale: days
mechanism: Highly reflective structures (to reject unwanted stellar light into space) and highly absorptive, photovoltaic-like
  structures (energy generators) in near-planetary space above the clouds. The source reports (Berdyugina and Kuhn
  2017) that such structures can be spatially and spectrally resolved through inversions of planetary reflected
  light curves acquired in multiple passbands, and that they can only be detected if spatially resolved in this
  way; unresolved, their spectral and polarimetric signatures are strongly diluted by global environmental signals.
data_requirements:
  cadence: reflected light curves in multiple passbands
