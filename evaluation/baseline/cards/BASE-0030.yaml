title: Organosulfur gases revealed by an elevated ethane-to-methane ratio on planets of M dwarfs
claim: Some terrestrial planets in the habitable zones of cool M dwarfs show an elevated C2H6/CH4 ratio caused by
  biogenic sulfur-containing gases such as CH3SCH3 and CH3S2CH3.
domain: biosignature
