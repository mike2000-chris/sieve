mechanism: Sulfur-containing compounds such as CH3SCH3 and CH3S2CH3 have been discussed as potential atmospheric
  biosignatures in Earth-type environments with low-UV conditions, e.g. planets in the habitable zone of cool M
  dwarfs. The source reports a study in which these gases did not build up to levels detectable by next-generation
  missions, but their presence could be inferred indirectly because they increase the C2H6/CH4 ratio.
