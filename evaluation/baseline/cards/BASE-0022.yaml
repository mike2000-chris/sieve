id: BASE-0022
version: 2
title: Ozone at 9.6 um with methane or nitrous oxide in mid-infrared spectra of rocky planets
claim: Some rocky habitable-zone planets show the 9.6 um O3 band together with out-of-equilibrium species such as
  CH4 (7.7 um) or N2O in their mid-infrared spectra.
domain: biosignature
signature_class: atmospheric_chemistry
observable: spectroscopy
timescale: snapshot
mechanism: O3 is a photochemical derivative of O2; its strong band near 9.6-9.7 um allows the presence of molecular
  oxygen to be inferred, which is a powerful biosignature when combined with other out-of-equilibrium species such
  as CH4 and/or N2O (Staguhn et al.). The O3 band lies in the middle of the N-band window and CH4 has a feature
  at 7.7 um; these features are broad and suitable for spectroscopy and photometry (Lopez-Morales et al.). Transmission,
  emission and phase-curve spectroscopy at 4-25 um with flux stability better than 5 ppm is proposed for planets
  of the nearest M dwarfs.
