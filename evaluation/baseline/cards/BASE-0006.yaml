id: BASE-0006
version: 3
title: Artificial objects in the solar system recognised by reflected-light polarimetry
claim: At least one object in the solar system, in space or on the surface of a solar-system body, shows a reflected-light
  polarisation signature of artificial rather than natural material.
domain: technosignature
signature_class: artificial_structure_geometry
observable: polarimetry
timescale: snapshot
mechanism: Space-based artefacts, possibly bearing messages like those on Pioneer and Voyager, could be present
  within the solar system. Artificial materials appear very different from natural ones in polarised light (Kissell
  1974), so they could be detected with reflected-light polarimetry using current technology; artefacts on the surfaces
  of solar-system objects could be detected similarly.
