id: BASE-0018
version: 1
title: Nitrogen dioxide from industry in ultraviolet-visible spectra of terrestrial exoplanets
claim: Some terrestrial exoplanets show NO2 absorption at 0.2-0.7 um at levels elevated by industrial processes.
domain: technosignature
signature_class: atmospheric_chemistry
observable: spectroscopy
timescale: snapshot
mechanism: 'Elevated NO2 in an exoplanet atmosphere could be consistent with ongoing industrial processes on the
  surface. NO2 absorbs broadly at 0.25-0.6 um with little overlap with other terrestrial atmospheric constituents
  (Socas-Navarro et al.). Order of magnitude as reported from Kopparapu et al.: a 15 m LUVOIR-like telescope could
  detect Earth-like NO2 levels for a planet around a Sun-like star at 10 pc in about 400 hours (Haqq-Misra et al.);
  Socas-Navarro et al. quote about 1000 hours at S/N 5. Planets of K dwarfs need less time because less NO2 is lost
  to photolysis.'
