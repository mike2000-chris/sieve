[project]
name = "sieve"
version = "0.1.0"
description = "SIEVE: systematic ideation and evaluation of life-detection hypotheses against existing archival data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Carsten Mielke" }]
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "pydantic>=2.6",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "numpy>=1.26",
  "pandas>=2.2",
  "astropy>=6.0",
  "astroquery>=0.4.7",
  "pyvo>=1.5",
  "lightkurve>=2.4",
  "boto3>=1.34",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
sieve = "pipeline.cards:main"

[tool.ruff]
line-length = 110
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
